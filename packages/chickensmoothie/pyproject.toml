[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chickensmoothie"
version = "0.1.0"
description = "Async Chicken Smoothie archive and opening-status client"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.13.5", "lxml>=6.0.4", "cssselect>=1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]
